<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile - FreshGuard AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="animations.css" />
<script src="main.js" defer></script>
</head>
<body class="page page-transition">
<div id="toast" class="toast"></div>

<header class="site-header">
  <div class="container navbar">
    <a class="brand" href="index.html"><div class="mark">FG</div><span>FreshGuard AI</span></a>
    <div class="nav-actions">
      <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
      <button id="logout-btn" class="btn btn-primary">Logout</button>
    </div>
  </div>
</header>

<section class="page" style="padding:30px 0 80px">
  <div class="container">
    <div class="card profile-card page-transition" style="max-width:560px;margin:0 auto">
      <div style="text-align:center;margin-bottom:26px">
        <h1 style="font-size:2rem;margin-bottom:6px">My Profile</h1>
        <p style="color:var(--text-muted)">Your account details</p>
      </div>

      <div style="text-align:center;margin-bottom:26px">
        <div class="brand" style="justify-content:center"><div class="mark">FG</div><span style="font-size:1.5rem">FreshGuard AI</span></div>
      </div>

      <div id="profile-loading" class="loading" style="display:none">
        <div class="loader"></div><div>Loading profile&#8230;</div>
      </div>

      <div id="profile-content" style="display:none">
        <div class="profile-row fade-in">
          <span class="label">Full Name</span>
          <span id="profName">-</span>
        </div>
        <div class="profile-row fade-in delay-1">
          <span class="label">Email</span>
          <span id="profEmail">-</span>
        </div>
        <div class="profile-row fade-in delay-2">
          <span class="label">Member Since</span>
          <span id="profSince">-</span>
        </div>
        <div class="profile-row fade-in delay-2">
          <span class="label">Account Status</span>
          <span style="color:var(--primary);font-weight:700">Active</span>
        </div>
      </div>

      <div id="profile-error" class="empty-state" style="display:none"></div>
    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const user = getAuthUser();
  if (!user) {
    location.href = "login.html";
    return;
  }

  const loadingEl = document.getElementById("profile-loading");
  const contentEl = document.getElementById("profile-content");
  const errorEl = document.getElementById("profile-error");

  async function loadProfile(){
    loadingEl.style.display = "flex";
    contentEl.style.display = "none";
    errorEl.style.display = "none";

    const res = await api("/api/auth/me");
    loadingEl.style.display = "none";

    if(!res.ok){
      errorEl.textContent = res.data.error || "Failed to load profile";
      errorEl.style.display = "block";
      return;
    }

    const u = res.data.user;
    document.getElementById("profName").textContent = u.full_name || "-";
    document.getElementById("profEmail").textContent = u.email || "-";
    document.getElementById("profSince").textContent = new Date().toLocaleDateString();
    contentEl.style.display = "block";
  }

  loadProfile();

  const logoutBtn = document.getElementById("logout-btn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      await api("/api/auth/logout", { method: "POST" });
      clearAuth();
      location.href = "index.html";
    });
  }
});
</script>
</body>
</html>
